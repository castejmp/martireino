<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Figus del Reino · Móvil v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#1b1340; --bg-2:#2a1b52; --bg-3:#120b2c; --night:#0b0820;
    --gold-1:#f6dd99; --gold-2:#e3b85f; --gold-3:#b98a35;
    --rose:#f1a8c6; --rose-deep:#d76a98;
    --ink:#f6f0e6; --muted:#b6abd4; --muted-2:#8a7eb0;
    --line:rgba(246,221,153,.18); --glass:rgba(34,24,66,.55);
    --green:#8ce6b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Mulish',sans-serif;background:#07050f;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
    overscroll-behavior:none}

  /* ---------- device ---------- */
  #device{position:relative;width:100%;max-width:430px;height:100vh;max-height:932px;
    background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 44%,var(--bg-3) 100%);
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 40px 120px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04)}
  @media(min-width:480px){ body{padding:18px} #device{border-radius:40px;height:92vh} }

  .aurora{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.55}
  .a1{width:420px;height:420px;left:-160px;top:-140px;background:radial-gradient(circle,#d76a98 0%,transparent 65%);animation:dr1 18s ease-in-out infinite alternate}
  .a2{width:460px;height:460px;right:-180px;bottom:-120px;background:radial-gradient(circle,#5b3fae 0%,transparent 65%);animation:dr2 22s ease-in-out infinite alternate}
  @keyframes dr1{to{transform:translate(40px,30px)}}
  @keyframes dr2{to{transform:translate(-36px,-26px)}}

  .stars{position:absolute;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 4.5s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.8;transform:scale(1)}}

  .castle{position:absolute;left:0;right:0;bottom:0;height:200px;z-index:0;opacity:.4;pointer-events:none}
  .castle svg{width:100%;height:100%;display:block}

  /* ---------- header ---------- */
  header{position:relative;z-index:6;display:none;align-items:center;gap:13px;
    padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
    background:linear-gradient(180deg,rgba(11,8,32,.72),transparent)}
  header.on{display:flex}
  .ringwrap{position:relative;width:52px;height:52px;flex:0 0 auto}
  .ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ringwrap .avx{position:absolute;inset:5px;border-radius:50%;background:rgba(227,184,95,.13);
    display:flex;align-items:center;justify-content:center;font-size:22px}
  .hid{flex:1;min-width:0}
  .hid .n{font-weight:800;font-size:16px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hid .s{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .hct{text-align:right;flex:0 0 auto}
  .hct .big{font-family:'Cormorant Garamond';font-weight:700;font-size:30px;line-height:.85;
    background:linear-gradient(180deg,#fff,var(--gold-1));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hct .big small{font-size:15px;color:var(--muted-2)}
  .hct .lbl{font-size:8.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:800;margin-top:2px}

  /* ---------- main scroll ---------- */
  main{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .pad{padding:18px 20px 110px}
  .pad.intro{padding-top:max(40px, 9vh)}

  /* ---------- bottom nav ---------- */
  nav{position:absolute;left:0;right:0;bottom:0;z-index:8;display:none;gap:6px;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(7,5,15,.88) 34%);backdrop-filter:blur(10px)}
  nav.on{display:flex}
  nav button{flex:1;appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted-2);
    font-family:'Mulish';font-weight:800;font-size:10.5px;letter-spacing:.06em;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;position:relative;
    transition:color .2s, background .2s}
  nav button .ic{font-size:21px;line-height:1;filter:grayscale(.5);transition:filter .2s, transform .2s}
  nav button.act{color:var(--gold-1);background:rgba(227,184,95,.1)}
  nav button.act .ic{filter:none;transform:translateY(-1px)}
  nav .dot{position:absolute;top:7px;right:calc(50% - 19px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;
    background:linear-gradient(180deg,var(--rose),var(--rose-deep));color:#3a0f23;font-size:10px;font-weight:900;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35)}

  /* ---------- typography ---------- */
  .kicker{font-weight:800;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-2)}
  h1.title{font-family:'Cormorant Garamond';font-weight:700;line-height:.9;margin:8px 0 0;font-size:clamp(48px,15vw,64px);
    background:linear-gradient(180deg,#fff 0%,var(--gold-1) 50%,var(--gold-2) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 18px rgba(227,184,95,.25))}
  .lead{color:var(--muted);font-size:15px;line-height:1.55;font-weight:500}
  .hint{font-size:12px;color:var(--muted-2);font-weight:600;line-height:1.5}
  .sh{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
  .sh .ln{flex:1;height:1px;background:var(--line)}
  .sh span{font-weight:800;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-2)}

  /* ---------- controls ---------- */
  .btn{appearance:none;border:0;cursor:pointer;font-family:'Mulish';font-weight:800;font-size:15px;
    padding:16px 22px;border-radius:16px;width:100%;color:#2a1c08;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2));
    box-shadow:0 10px 30px rgba(227,184,95,.32), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .12s ease, filter .2s}
  .btn:active{transform:translateY(2px) scale(.99);filter:brightness(.96)}
  .btn[disabled]{opacity:.4;filter:grayscale(.4);pointer-events:none}
  .btn.rose{background:linear-gradient(180deg,var(--rose),var(--rose-deep));color:#3a0f23;box-shadow:0 10px 30px rgba(215,106,152,.32)}
  .btn.ghost{background:transparent;color:var(--gold-1);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.sm{padding:11px 14px;font-size:13px;border-radius:12px;width:auto}
  .field{width:100%;background:rgba(11,8,32,.6);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;color:var(--ink);font-family:'Mulish';font-weight:700;font-size:16px;outline:none}
  .field::placeholder{color:var(--muted-2);font-weight:600}
  .field:focus{border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(227,184,95,.14)}

  /* ---------- onboarding avatars ---------- */
  .avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .av{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:var(--glass);border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:27px;position:relative;transition:.15s}
  .av small{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.05em}
  .av.sel{border-color:var(--gold-1);background:rgba(227,184,95,.14);transform:translateY(-2px)}
  .av.sel:after{content:"✓";position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#2a1c08;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(227,184,95,.5)}

  /* ---------- album grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .fig{position:relative;border-radius:15px;aspect-ratio:.72;overflow:hidden;border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(165deg,rgba(43,30,86,.75),rgba(18,11,44,.8));display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:8px 6px}
  .fig.empty{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px),rgba(11,8,32,.5);
    border-style:dashed;border-color:rgba(255,255,255,.11)}
  .fig.empty .q{font-family:'Cormorant Garamond';font-size:32px;color:var(--muted-2);font-weight:700}
  .fig .glyph{font-size:33px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .fig .fn{font-family:'Cormorant Garamond';font-weight:600;font-size:14px;line-height:1;margin-top:7px;color:#fff}
  .fig .fm{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
  .fig .no{position:absolute;top:6px;left:8px;font-size:9px;font-weight:800;color:var(--muted-2)}
  .fig.have:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,rgba(227,184,95,.1));pointer-events:none}
  .fig.r-rara{box-shadow:inset 0 0 0 1px rgba(241,168,198,.35)}
  .fig.r-epica{box-shadow:inset 0 0 0 1px rgba(246,221,153,.55)}
  .fig .dq{position:absolute;bottom:6px;right:6px;background:linear-gradient(180deg,var(--rose),var(--rose-deep));
    color:#3a0f23;font-size:9px;font-weight:900;border-radius:8px;padding:2px 6px}
  .fig.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}

  .goldrow{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .gcard{aspect-ratio:.72;border-radius:15px;position:relative;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:8px;
    background:linear-gradient(165deg,#2c2143,#191130);border:1px solid var(--line)}
  .gcard.locked{filter:grayscale(.55);opacity:.6}
  .gcard.won{background:linear-gradient(165deg,#3a2c12,#191130);border-color:var(--gold-1);
    box-shadow:0 0 22px rgba(227,184,95,.25)}
  .gcard .glyph{font-size:30px}
  .gcard .fn{font-family:'Cormorant Garamond';font-weight:700;font-size:13px;color:var(--gold-1);margin-top:6px;line-height:1.05}
  .gcard .lk{position:absolute;top:7px;right:8px;font-size:12px;opacity:.75}

  /* ---------- sources ---------- */
  .srcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .src{background:var(--glass);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 13px;
    text-align:left;cursor:pointer;transition:.15s;position:relative}
  .src:active{transform:scale(.98)}
  .src .ic{font-size:22px}
  .src .t{font-weight:800;font-size:13px;margin-top:8px;line-height:1.15}
  .src .d{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.35}
  .src.spent{opacity:.38;pointer-events:none}
  .src.spent:after{content:"✓ usado";position:absolute;top:10px;right:11px;font-size:9px;font-weight:900;
    letter-spacing:.08em;color:var(--green);text-transform:uppercase}

  .wall{border:1px solid rgba(241,168,198,.3);border-radius:18px;padding:18px 16px;
    background:linear-gradient(165deg,rgba(215,106,152,.12),rgba(34,24,66,.4))}
  .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(227,184,95,.12);border:1px solid var(--line);
    border-radius:99px;padding:6px 12px;font-size:11px;font-weight:800;color:var(--gold-1)}

  /* ---------- trade tab ---------- */
  .card{background:var(--glass);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:16px}
  .req{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;margin-top:9px;
    background:rgba(11,8,32,.5);border:1px solid rgba(255,255,255,.06)}
  .req .fg{width:42px;height:42px;border-radius:12px;background:rgba(241,168,198,.12);border:1px solid rgba(241,168,198,.25);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
  .req .tx{flex:1;min-width:0}
  .req .tx .a{font-size:13.5px;font-weight:700;line-height:1.25}
  .req .tx .a b{color:var(--gold-1)}
  .req .tx .b{font-size:10.5px;color:var(--muted-2);font-weight:700;margin-top:2px}
  .mreq{border:1px solid rgba(241,168,198,.35);background:linear-gradient(90deg,rgba(241,168,198,.12),rgba(34,24,66,.3))}
  .codebig{font-family:'Cormorant Garamond';font-weight:700;font-size:42px;letter-spacing:.2em;color:var(--gold-1);text-align:center}

  /* ---------- feed ---------- */
  .feed .ev{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;margin-bottom:9px;border-radius:13px;
    background:rgba(34,24,66,.45);border:1px solid rgba(255,255,255,.05);font-size:13.5px;font-weight:600;line-height:1.35;
    animation:slin .5s cubic-bezier(.2,.8,.2,1)}
  .feed .ev.mine{border-color:rgba(246,221,153,.28);background:rgba(227,184,95,.08)}
  .feed .ev .ic{font-size:16px;flex:0 0 auto;line-height:1.3}
  .feed .ev b{color:#fff;font-weight:800}
  .feed .ev .g{color:var(--gold-1);font-weight:800}
  .feed .ev .r{color:var(--rose);font-weight:800}
  .feed .ev .t{display:block;font-size:9.5px;color:var(--muted-2);font-weight:800;letter-spacing:.08em;margin-top:4px;text-transform:uppercase}
  @keyframes slin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- sheet / overlays ---------- */
  .sheet{position:absolute;inset:0;z-index:30;background:rgba(7,5,15,.86);backdrop-filter:blur(9px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto}
  .sheet.on{opacity:1;pointer-events:auto}
  .mcard{width:100%;max-width:340px;background:linear-gradient(180deg,var(--bg-2),var(--bg-3));
    border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}

  /* envelope */
  .env{width:178px;height:124px;border-radius:16px;margin:14px auto 22px;position:relative;cursor:pointer;
    background:linear-gradient(180deg,var(--bg-2),var(--bg-3));border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.5);transition:transform .2s}
  .env:active{transform:scale(.97)}
  .env:before{content:"";position:absolute;inset:0;border-radius:16px;
    background:linear-gradient(135deg,transparent 40%,rgba(246,221,153,.18) 50%,transparent 60%)}
  .env .flapline{position:absolute;left:0;right:0;top:0;height:54%;
    clip-path:polygon(0 0,100% 0,50% 100%);border-radius:16px 16px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);border-bottom:1px solid rgba(246,221,153,.2)}
  .env .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold-1),var(--gold-3));display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#2a1c08;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}

  /* card flip reveal */
  .reveal{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:344px}
  .flip{width:88px;aspect-ratio:.72;perspective:600px;opacity:0;transform:translateY(14px);animation:rin .4s forwards}
  @keyframes rin{to{opacity:1;transform:translateY(0)}}
  .flip .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
  .flip.go .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 5px;border:1px solid rgba(255,255,255,.09)}
  .face.fr{background:
    repeating-linear-gradient(45deg,rgba(246,221,153,.07) 0 7px,transparent 7px 14px),
    linear-gradient(165deg,#241a4d,#140d31)}
  .face.fr .mono{font-family:'Cormorant Garamond';font-weight:700;font-size:26px;color:var(--gold-2)}
  .face.bk{transform:rotateY(180deg);background:linear-gradient(165deg,rgba(43,30,86,.97),rgba(18,11,44,.97))}
  .face.bk .g{font-size:29px}
  .face.bk .nm{font-family:'Cormorant Garamond';font-weight:600;font-size:11.5px;color:#fff;margin-top:5px;line-height:1.05}
  .face.bk .tag{font-size:7.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;margin-top:5px}
  .flip.new .face.bk .tag{color:var(--green)}
  .flip.rep .face.bk .tag{color:var(--rose)}
  .flip.rara .face.bk{box-shadow:inset 0 0 0 1px rgba(241,168,198,.55)}
  .flip.epica .face.bk{box-shadow:inset 0 0 0 1px var(--gold-1)}
  .flip.dorada .face.bk{background:linear-gradient(165deg,#3a2c12,#171026);box-shadow:inset 0 0 0 1px var(--gold-1),0 0 26px rgba(227,184,95,.45)}
  .flip.dorada .face.bk .tag{color:var(--gold-1)}

  /* trivia */
  .opts{display:grid;grid-template-columns:1fr;gap:9px;margin-top:16px}
  .opt{background:rgba(11,8,32,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;
    font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);text-align:left}
  .opt .k{width:28px;height:28px;border-radius:8px;background:rgba(246,221,153,.14);color:var(--gold-1);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond';font-weight:700;font-size:16px}
  .opt:active{transform:scale(.98)}
  .opt.bad{animation:shake .4s;border-color:rgba(241,107,107,.6)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .ringt{position:relative;width:74px;height:74px;margin:18px auto 0}
  .ringt svg{transform:rotate(-90deg)}
  .ringt .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond';font-weight:700;font-size:30px;color:var(--gold-1)}

  /* dorada / takeover */
  .rays{position:absolute;width:680px;height:680px;left:50%;top:42%;transform:translate(-50%,-50%);z-index:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(246,221,153,0),rgba(246,221,153,.15) 4%,rgba(246,221,153,0) 9%,
      rgba(246,221,153,0),rgba(246,221,153,.15) 29%,rgba(246,221,153,0) 34%,rgba(246,221,153,0),
      rgba(246,221,153,.15) 54%,rgba(246,221,153,0) 59%,rgba(246,221,153,0),rgba(246,221,153,.15) 79%,rgba(246,221,153,0) 84%);
    animation:spin 22s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .ticket{width:225px;border-radius:20px;padding:22px 16px 18px;position:relative;z-index:2;text-align:center;
    background:linear-gradient(165deg,#3a2c12,#171026);border:1px solid var(--gold-1);
    box-shadow:0 24px 70px rgba(227,184,95,.35),0 0 0 4px rgba(246,221,153,.08);animation:pop .6s ease}
  .ticket .crown{font-size:44px}
  .ticket .nm{font-family:'Cormorant Garamond';font-weight:700;font-size:26px;color:var(--gold-1);margin-top:6px;line-height:1}
  .ticket .sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:8px}
  .ticket .ser{margin-top:13px;font-size:11px;color:var(--gold-2);font-weight:900;letter-spacing:.12em}

  .swap{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0}
  .swap .mini{flex:1;border-radius:14px;padding:12px 8px;text-align:center;background:rgba(11,8,32,.5);border:1px solid rgba(255,255,255,.07)}
  .swap .mini .g{font-size:30px}
  .swap .mini .nm{font-family:'Cormorant Garamond';font-weight:600;font-size:12px;margin-top:5px;color:#fff;line-height:1.05}
  .swap .mini .who{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
  .swap .ar{font-size:22px;color:var(--gold-1)}

  /* toast + confetti */
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);z-index:60;
    background:rgba(11,8,32,.94);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px;
    padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;max-width:86%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #confetti{position:absolute;inset:0;z-index:55;pointer-events:none}

  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
  .center{text-align:center}
  .footnote{text-align:center;font-size:10px;color:var(--muted-2);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:28px}

  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="device">
  <div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="stars" id="stars"></div>
  <div class="castle">
    <svg viewBox="0 0 430 200" preserveAspectRatio="xMidYMax meet">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a2a66"/><stop offset="1" stop-color="#150d31"/></linearGradient></defs>
      <g fill="url(#cg)">
        <rect x="36" y="128" width="58" height="72"/><polygon points="36,128 65,92 94,128"/>
        <rect x="336" y="128" width="58" height="72"/><polygon points="336,128 365,92 394,128"/>
        <rect x="148" y="104" width="134" height="96"/>
        <rect x="176" y="58" width="32" height="142"/><polygon points="176,58 192,24 208,58"/>
        <rect x="222" y="58" width="32" height="142"/><polygon points="222,58 238,24 254,58"/>
        <rect x="120" y="150" width="190" height="50"/>
      </g>
      <g fill="#f6dd99" opacity=".85">
        <rect x="187" y="78" width="8" height="13" rx="3"/><rect x="233" y="78" width="8" height="13" rx="3"/>
        <rect x="58" y="146" width="9" height="15" rx="3"/><rect x="362" y="146" width="9" height="15" rx="3"/>
        <rect x="204" y="132" width="20" height="32" rx="9"/>
      </g>
    </svg>
  </div>

  <header id="hdr"></header>
  <main><div id="view" class="pad"></div></main>
  <nav id="nav">
    <button data-tab="album"><span class="ic">📔</span>Álbum</button>
    <button data-tab="trade"><span class="ic">🔄</span>Cambiar</button>
    <button data-tab="feed"><span class="ic">🏰</span>El Reino<span class="dot" id="feedDot" style="display:none">0</span></button>
  </nav>

  <div class="sheet" id="sheet"></div>
  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= DATA ================= */
const FIGS=[
  {id:1,g:"🐚",nm:"Marti Sirena",fm:"La Sirenita",r:"comun"},
  {id:2,g:"❄️",nm:"Marti de Hielo",fm:"Frozen",r:"comun"},
  {id:3,g:"🌺",nm:"Marti Navegante",fm:"Moana",r:"comun"},
  {id:4,g:"🗡️",nm:"Marti Guerrera",fm:"Mulán",r:"comun"},
  {id:5,g:"🪔",nm:"Marti Jazmín",fm:"Aladdín",r:"comun"},
  {id:6,g:"🌹",nm:"Marti Bella",fm:"La Bella y la Bestia",r:"comun"},
  {id:7,g:"👠",nm:"Marti Cenicienta",fm:"Cenicienta",r:"comun"},
  {id:8,g:"💜",nm:"Marti Rapunzel",fm:"Enredados",r:"comun"},
  {id:9,g:"🍎",nm:"Marti Blanca",fm:"Blancanieves",r:"rara"},
  {id:10,g:"🌿",nm:"Marti Aurora",fm:"La Bella Durmiente",r:"rara"},
  {id:11,g:"🍃",nm:"Marti Pocahontas",fm:"Pocahontas",r:"rara"},
  {id:12,g:"🏹",nm:"Marti Valiente",fm:"Brave",r:"rara"},
  {id:13,g:"🐸",nm:"Marti Tiana",fm:"La Princesa y el Sapo",r:"rara"},
  {id:14,g:"🦋",nm:"Marti Encanto",fm:"Encanto",r:"epica"},
  {id:15,g:"🖤",nm:"Marti Maléfica",fm:"Maléfica",r:"epica"},
];
const GOLD=[
  {g:"👑",nm:"Marti · El Vals"},
  {g:"🤍",nm:"Marti & Papá"},
  {g:"✨",nm:"Marti Reina"},
];
const AVATARS=[
  {g:"👑",n:"Princesa"},{g:"🧚",n:"Hada"},{g:"🦋",n:"Mariposa"},{g:"🌹",n:"Rosa"},
  {g:"🐉",n:"Dragón"},{g:"🦢",n:"Cisne"},{g:"⭐",n:"Estrella"},{g:"🏰",n:"Castillo"},
];
const GUESTS=["Sofi","Tomi","Juli","Cande","Nacho","Valen","Mía","Benja","Lola","Fran"];
const TRIVIA=[
  {q:"¿En qué película Marti sería una sirena?",o:["La Sirenita","Moana","Frozen","Encanto"],a:0},
  {q:"¿Quién canta «Libre soy»?",o:["Moana","Elsa","Rapunzel","Tiana"],a:1},
  {q:"¿De qué reino es Moana?",o:["Arendelle","Agrabah","Motunui","Corona"],a:2},
  {q:"¿Cómo se llama el dragón de Mulán?",o:["Abu","Mushu","Pascal","Sven"],a:1},
];
const CODEWORDS=["FROZEN","MOANA","STITCH","AURORA","ENCANTO"];
const SRC={
  start:{ic:"🎁",t:"Sobre de bienvenida",d:"Tu único sobre al entrar",n:5,dor:.18},
  codigo:{ic:"📣",t:"Código sorpresa",d:"Marti dice una palabra por mic",n:4,dor:.18},
  trivia:{ic:"💡",t:"Trivia Disney",d:"Acertá y entrá al sorteo",n:4,dor:.18},
  carta:{ic:"🃏",t:"Carta escondida",d:"Buscala por el salón",n:4,dor:.35},
};

/* ================= STATE ================= */
let S;
function freshState(){
  return {
    screen:"intro", tab:"album",
    name:"", avatar:null,
    counts:{}, golds:[false,false,false],
    sources:{start:true,codigo:true,trivia:true,carta:true},
    myReq:null, reqTimer:null,
    salon:[], feed:[], unread:0,
    relojWon:false, done:false,
    myCode:String(Math.floor(1000+Math.random()*9000)),
  };
}
S=freshState();

const $=s=>document.querySelector(s);
const view=$("#view"), sheet=$("#sheet"), hdr=$("#hdr"), nav=$("#nav");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fig=id=>FIGS.find(f=>f.id===id);
const owned=id=>(S.counts[id]||0)>0;
const uniques=()=>FIGS.filter(f=>owned(f.id)).length;
const missing=()=>FIGS.filter(f=>!owned(f.id));
const dupes=()=>FIGS.filter(f=>(S.counts[f.id]||0)>1);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2300);}

/* weighted draw — épicas casi nunca: el muro que obliga a cambiar */
const POOL=(()=>{const w={comun:10,rara:4,epica:1};const p=[];
  FIGS.forEach(f=>{for(let i=0;i<w[f.r];i++)p.push(f.id)});return p;})();
const drawOne=()=>POOL[Math.floor(Math.random()*POOL.length)];

/* ================= STARS ================= */
(function(){let h="";for(let i=0;i<42;i++){
  const x=Math.random()*100,y=Math.random()*68,z=Math.random()*2+1,d=Math.random()*4;
  h+=`<i style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;animation-delay:${d}s"></i>`;}
  $("#stars").innerHTML=h;})();

/* ================= FEED ENGINE ================= */
function feedPush(html,ic,mine){
  S.feed.unshift({html,ic,mine,t:new Date()});
  if(S.feed.length>30)S.feed.pop();
  if(S.tab!=="feed"&&S.screen==="app"){S.unread++;paintDot();}
  if(S.tab==="feed")renderTab();
}
function paintDot(){const d=$("#feedDot");
  d.style.display=S.unread?"flex":"none";d.textContent=Math.min(S.unread,9);}
function ambient(){
  const r=Math.random(),A=rnd(GUESTS);let B=rnd(GUESTS);while(B===A)B=rnd(GUESTS);
  const f=rnd(FIGS);
  if(r<.3)return feedPush(`<b>${A}</b> y <b>${B}</b> cambiaron figus`,"🔄");
  if(r<.55)return feedPush(`<b>${A}</b> abrió un sobre y encontró a <span class="g">${f.nm} ${f.g}</span>`,"🎁");
  if(r<.72)return feedPush(`<b>${A}</b> le pasó <span class="g">${f.nm}</span> a <b>${B}</b> — ¡genia!`,"🤝");
  if(r<.86)return feedPush(`<b>${A}</b> ya va <span class="g">${10+Math.floor(Math.random()*4)}/15</span>`,"🏆");
  return feedPush(`<b>${A}</b> abrió otro sobre y… repetida. Bancá ${A} 🥲`,"🫂");
}
let ambIv=null;
function startAmbient(){if(!ambIv)ambIv=setInterval(()=>{if(S.screen==="app")ambient();},7000);}

/* salon requests */
function newSalonReq(){
  const who=rnd(GUESTS);
  return {who,figId:rnd(FIGS).id};
}
function seedSalon(){S.salon=[newSalonReq(),newSalonReq(),newSalonReq()];}

/* ================= RENDER ROUTER ================= */
function render(){
  if(S.screen==="intro"){hdr.classList.remove("on");nav.classList.remove("on");renderIntro();return;}
  hdr.classList.add("on");nav.classList.add("on");
  renderHeader();renderTab();paintDot();
}
function renderHeader(){
  const u=uniques(),C=131.95,off=C*(1-u/15);
  hdr.innerHTML=`
    <div class="ringwrap">
      <svg width="52" height="52"><circle cx="26" cy="26" r="21" stroke="rgba(255,255,255,.1)" stroke-width="3.5" fill="none"/>
      <circle cx="26" cy="26" r="21" stroke="url(#hg)" stroke-width="3.5" fill="none" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)"/>
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f1a8c6"/><stop offset="1" stop-color="#f6dd99"/></linearGradient></defs></svg>
      <div class="avx">${S.avatar.g}</div>
    </div>
    <div class="hid"><div class="n">${S.name}</div><div class="s">Reino de Marti</div></div>
    <div class="hct"><div class="big">${u}<small>/15</small></div><div class="lbl">figus</div></div>`;
}
nav.querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>{S.tab=b.dataset.tab;
    if(S.tab==="feed"){S.unread=0;paintDot();}
    nav.querySelectorAll("button").forEach(x=>x.classList.toggle("act",x===b));
    renderTab();});
});
function syncNav(){nav.querySelectorAll("button").forEach(x=>x.classList.toggle("act",x.dataset.tab===S.tab));}

function renderTab(){
  syncNav();
  if(S.tab==="album")return renderAlbum();
  if(S.tab==="trade")return renderTrade();
  return renderFeed();
}

/* ================= INTRO ================= */
function renderIntro(){
  view.className="pad intro";
  view.innerHTML=`
    <div class="center">
      <div class="kicker">Los XV de Marti</div>
      <h1 class="title">Figus<br>del Reino</h1>
      <p class="lead mt16">Juntá las <b style="color:var(--ink)">15 figuritas</b> de Marti convertida en princesa.
      Con tu sobre solo no alcanza: el álbum se completa <b style="color:var(--rose)">cambiando con la gente</b>.</p>
    </div>
    <div class="mt20">
      <label class="hint">Tu nombre</label>
      <input class="field mt8" id="nameIn" maxlength="16" placeholder="¿Cómo te llamás?" value="${S.name}">
    </div>
    <div class="mt16">
      <label class="hint">Elegí tu personaje</label>
      <div class="avgrid" id="avs">
        ${AVATARS.map((a,i)=>`<div class="av ${S.avatar&&S.avatar.n===a.n?'sel':''}" data-i="${i}">${a.g}<small>${a.n}</small></div>`).join("")}
      </div>
    </div>
    <button class="btn mt20" id="go">Entrar al Reino</button>
    <p class="footnote">Tu pulsera es tu cuenta · sin instalar nada</p>`;
  $("#nameIn").addEventListener("input",e=>S.name=e.target.value.trim());
  view.querySelectorAll(".av").forEach(el=>el.addEventListener("click",()=>{
    S.avatar=AVATARS[+el.dataset.i];renderIntro();}));
  $("#go").addEventListener("click",()=>{
    if(!S.name)return toast("Poné tu nombre 🙂");
    if(!S.avatar)return toast("Elegí un personaje ✨");
    S.screen="app";S.tab="album";seedSalon();startAmbient();
    view.className="pad";render();
    feedPush(`<b>Vos</b> entraste al Reino ✦ ¡bienvenida!`,"🏰",true);
    setTimeout(()=>openPack("start"),420);
  });
}

/* ================= ÁLBUM ================= */
function figCard(f){
  const q=S.counts[f.id]||0;
  if(!q)return`<div class="fig empty"><span class="no">${String(f.id).padStart(2,"0")}</span>
    <span class="q">?</span><div class="fm" style="margin-top:6px">${f.fm}</div></div>`;
  return`<div class="fig have r-${f.r}"><span class="no">${String(f.id).padStart(2,"0")}</span>
    <span class="glyph">${f.g}</span><div class="fn">${f.nm}</div><div class="fm">${f.fm}</div>
    ${q>1?`<span class="dq">x${q}</span>`:""}</div>`;
}
function renderAlbum(){
  const u=uniques(),left=Object.keys(S.sources).filter(k=>S.sources[k]);
  let act="";
  if(S.done){
    act=`<div class="wall center mt8"><div class="pill">👑 Reino completo</div>
      <p class="hint mt12">Ya tenés tu carta dorada esperándote en el Mercadito.</p></div>`;
  }else if(left.length){
    act=`
      <div class="sh"><span>Conseguir sobres</span><div class="ln"></div></div>
      <p class="hint" style="margin-bottom:11px">Los sobres son contados — caen solo en momentos de la noche.
      <em>En la fiesta los dispara la pantalla grande; acá simulalos tocando.</em></p>
      <div class="srcs">
        ${Object.keys(SRC).map(k=>`<div class="src ${S.sources[k]?"":"spent"}" data-src="${k}">
          <div class="ic">${SRC[k].ic}</div><div class="t">${SRC[k].t}</div><div class="d">${SRC[k].d}</div></div>`).join("")}
      </div>`;
  }else{
    act=`
      <div class="sh"><span>Te faltan ${15-u}</span><div class="ln"></div></div>
      <div class="wall">
        <div class="pill">🔒 No salen más en sobres</div>
        <p class="hint mt12">Abriste todos tus sobres. Las que faltan son las más raras del Reino —
        la única forma de cerrarlo es <b style="color:var(--rose)">cambiando con alguien</b>.</p>
        <button class="btn rose mt16" id="goTrade">Ir a cambiar</button>
      </div>`;
  }
  view.innerHTML=`
    <div class="grid">${FIGS.map(figCard).join("")}</div>
    ${act}
    <div class="sh"><span>Doradas · pura suerte</span><div class="ln"></div></div>
    <div class="goldrow">
      ${GOLD.map((g,i)=>`<div class="gcard ${S.golds[i]?"won":"locked"}">
        <span class="lk">${S.golds[i]?"✨":"🔒"}</span><span class="glyph">${g.g}</span>
        <div class="fn">${g.nm}</div></div>`).join("")}
    </div>
    <p class="footnote">No hacen falta para ganar · la primera dorada de la noche se lleva el Reloj Disney 🕛</p>`;
  view.querySelectorAll(".src").forEach(el=>el.addEventListener("click",()=>routeSource(el.dataset.src)));
  const g=$("#goTrade");if(g)g.addEventListener("click",()=>{S.tab="trade";renderTab();});
}

/* ================= SOURCES ================= */
function routeSource(k){
  if(k==="start")return openPack("start");
  if(k==="codigo")return codigoFlow();
  if(k==="trivia")return triviaFlow();
  if(k==="carta")return cartaFlow();
}
function showSheet(html){sheet.innerHTML=html;sheet.classList.add("on");}
function hideSheet(){sheet.classList.remove("on");setTimeout(()=>{if(!sheet.classList.contains("on"))sheet.innerHTML="";},260);}

/* ---- envelope + flip reveal ---- */
function openPack(srcKey){
  const meta=SRC[srcKey];
  showSheet(`
    <div class="kicker">${srcKey==="start"?"Tu sobre de bienvenida":"¡Un sobre más!"}</div>
    <div class="env" id="env"><div class="flapline"></div><div class="seal">✦</div></div>
    <p class="lead" style="max-width:250px">Tocá el sello para abrirlo</p>`);
  $("#env").addEventListener("click",()=>{
    const draws=[];for(let i=0;i<meta.n;i++)draws.push(drawOne());
    let dorIdx=-1;
    if(GOLD.some((_,i)=>!S.golds[i]) && Math.random()<meta.dor){
      const locked=GOLD.map((_,i)=>i).filter(i=>!S.golds[i]);
      dorIdx=rnd(locked);S.golds[dorIdx]=true;
    }
    const cards=draws.map(id=>{const b=S.counts[id]||0;S.counts[id]=b+1;return{f:fig(id),nu:b===0};});
    S.sources[srcKey]=false;
    const nNew=cards.filter(c=>c.nu).length;
    feedPush(`<b>Vos</b> abriste un sobre — <span class="g">${nNew} nuevas</span>, ${cards.length-nNew} repetidas`,"🎁",true);

    showSheet(`
      <div class="kicker">Conseguiste</div>
      <div class="reveal mt16">
        ${cards.map((c,i)=>`<div class="flip ${c.nu?"new":"rep"} ${c.f.r}" style="animation-delay:${i*.1}s">
          <div class="inner">
            <div class="face fr"><span class="mono">✦</span></div>
            <div class="face bk"><span class="g">${c.f.g}</span><div class="nm">${c.f.nm}</div>
              <div class="tag">${c.nu?"¡Nueva!":"Repetida"}</div></div>
          </div></div>`).join("")}
        ${dorIdx>=0?`<div class="flip dorada" style="animation-delay:${cards.length*.1}s">
          <div class="inner"><div class="face fr"><span class="mono">✦</span></div>
          <div class="face bk"><span class="g">${GOLD[dorIdx].g}</span><div class="nm">${GOLD[dorIdx].nm}</div>
            <div class="tag">¡Dorada!</div></div></div></div>`:""}
      </div>
      <button class="btn mt20" id="cont" style="max-width:240px">Ver mi álbum</button>`);
    // flip them in sequence
    sheet.querySelectorAll(".flip").forEach((el,i)=>setTimeout(()=>el.classList.add("go"),420+i*160));
    $("#cont").addEventListener("click",()=>{
      hideSheet();S.tab="album";render();
      if(dorIdx>=0)setTimeout(()=>doradaOverlay(dorIdx),300);
      else afterGain();
    });
  });
}
function afterGain(){
  if(uniques()===15&&!S.done)return setTimeout(completion,420);
  const left=Object.values(S.sources).some(v=>v);
  if(!left&&uniques()<15)toast("Te quedan huecos… ¡toca cambiar! 🔄");
}

/* ---- código sorpresa ---- */
function codigoFlow(){
  const w=rnd(CODEWORDS);
  showSheet(`
    <div class="mcard">
      <div class="kicker center">📣 Código sorpresa</div>
      <p class="hint center mt8">Marti dice por micrófono:</p>
      <div class="codebig" style="font-size:46px;letter-spacing:.14em;margin:8px 0 4px">${w}</div>
      <p class="hint center" style="margin-bottom:14px">Tipealo antes de que se cierre</p>
      <input class="field" id="cw" placeholder="Escribí la palabra" autocomplete="off" style="text-align:center;text-transform:uppercase">
      <button class="btn mt12" id="okc">Enviar</button>
      <button class="btn ghost mt8" id="noc">Cerrar</button>
    </div>`);
  $("#noc").addEventListener("click",hideSheet);
  $("#okc").addEventListener("click",()=>{
    if($("#cw").value.trim().toUpperCase()===w){hideSheet();setTimeout(()=>openPack("codigo"),200);}
    else{$("#cw").classList.add("bad" );toast("Esa no era 🙈");setTimeout(()=>$("#cw")&&$("#cw").classList.remove("bad"),450);}
  });
}

/* ---- trivia ---- */
function triviaFlow(){
  const t=rnd(TRIVIA),K=["A","B","C","D"],dur=8000,C=226;
  showSheet(`
    <div class="mcard">
      <div class="kicker center">💡 Trivia Disney</div>
      <h2 class="center" style="font-family:'Cormorant Garamond';font-weight:700;font-size:24px;line-height:1.1;margin:12px 0 0;color:#fff">${t.q}</h2>
      <div class="opts" id="opts">${t.o.map((o,i)=>`<div class="opt" data-i="${i}"><span class="k">${K[i]}</span>${o}</div>`).join("")}</div>
      <div class="ringt"><svg width="74" height="74"><circle cx="37" cy="37" r="32" stroke="rgba(255,255,255,.1)" stroke-width="6" fill="none"/>
        <circle id="trc" cx="37" cy="37" r="32" stroke="#f6dd99" stroke-width="6" fill="none" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="n" id="trn">8</div></div>
    </div>`);
  let alive=true;const start=performance.now();
  (function anim(now){if(!alive)return;const e=Math.min(1,(now-start)/dur);
    const c=$("#trc");if(!c){alive=false;return;}
    c.style.strokeDashoffset=(C*e).toFixed(1);$("#trn").textContent=Math.ceil(8*(1-e));
    if(e<1)requestAnimationFrame(anim);else{alive=false;triviaMiss("¡Se cerró la ronda!");}})(start);
  sheet.querySelectorAll(".opt").forEach(el=>el.addEventListener("click",()=>{
    if(!alive)return;
    if(+el.dataset.i===t.a){alive=false;triviaWin();}
    else{el.classList.add("bad");setTimeout(()=>el.classList.remove("bad"),420);}
  }));
  function triviaMiss(msg){showSheet(`
    <div class="mcard center"><div class="kicker">💡 Trivia</div>
      <p class="lead mt12">${msg}<br>Habrá más rondas en la noche.</p>
      <button class="btn mt16" id="rt">Probar otra ronda</button>
      <button class="btn ghost mt8" id="cl">Cerrar</button></div>`);
    $("#rt").addEventListener("click",triviaFlow);$("#cl").addEventListener("click",hideSheet);}
  function triviaWin(){
    showSheet(`<div class="mcard center"><div class="kicker">💡 Trivia</div>
      <p class="lead mt12">¡Correcta! Sorteando entre los que acertaron…</p>
      <div class="codebig mt12" style="letter-spacing:.04em">✦ ✦ ✦</div></div>`);
    setTimeout(()=>{
      feedPush(`<b>Vos</b> ganaste la ronda de trivia 💡`,"🏆",true);
      showSheet(`<div class="mcard center"><div class="kicker">🎉 ¡Saliste sorteada!</div>
        <p class="lead mt12">Te llevás un <b style="color:var(--rose)">peluche Disney 🧸</b><br>y un sobre extra.</p>
        <button class="btn mt16" id="op">Abrir mi sobre</button></div>`);
      $("#op").addEventListener("click",()=>openPack("trivia"));
    },1500);
  }
}

/* ================= CAMBIAR ================= */
function renderTrade(){
  if(S.done){
    view.innerHTML=`<div class="wall center" style="margin-top:8vh">
      <div class="pill">👑 Ya completaste el Reino</div>
      <p class="hint mt12">Tus repetidas ahora valen oro: regalalas y salvá el álbum de alguien.</p></div>`;
    return;
  }
  const myReqHtml = S.myReq
    ? `<div class="req mreq"><div class="fg">${fig(S.myReq).g}</div>
        <div class="tx"><div class="a">Estás buscando <b>${fig(S.myReq).nm}</b></div>
        <div class="b">Tu pedido se ve en la pantalla grande</div></div>
        <button class="btn ghost sm" id="cancelReq">✕</button></div>`
    : `<button class="btn rose mt8" id="pubReq">🙋 Pedir una figu</button>`;

  const salonHtml=S.salon.map((r,i)=>{
    const f=fig(r.figId),can=(S.counts[f.id]||0)>1&&missing().length>0;
    return`<div class="req"><div class="fg">${f.g}</div>
      <div class="tx"><div class="a"><b>${r.who}</b> busca <b>${f.nm}</b></div>
      <div class="b">${can?"La tenés repetida":"No la tenés repetida"}</div></div>
      ${can?`<button class="btn sm" data-offer="${i}">Ofrecer</button>`:""}</div>`;}).join("");

  view.innerHTML=`
    <div class="sh" style="margin-top:4px"><span>Se busca</span><div class="ln"></div></div>
    <div class="card">
      <p class="hint">Elegí una figu que te falte y tu pedido sale al salón. Sin escribir nada — todo con botones.</p>
      ${myReqHtml}
    </div>
    <div class="sh"><span>Pedidos del salón</span><div class="ln"></div></div>
    <div class="card">${salonHtml||`<p class="hint">Nadie está buscando ahora mismo…</p>`}</div>
    <div class="sh"><span>Canje directo</span><div class="ln"></div></div>
    <div class="card center">
      <p class="hint">¿Están cara a cara? Conéctense con el código.</p>
      <div class="codebig mt8">${S.myCode}</div>
      <p class="hint" style="margin:2px 0 12px">tu código</p>
      <input class="field" id="codeIn" inputmode="numeric" maxlength="4" placeholder="– – – –"
        style="text-align:center;letter-spacing:.4em;font-size:22px">
      <button class="btn mt12" id="conn">Conectar</button>
    </div>`;
  const p=$("#pubReq");if(p)p.addEventListener("click",pickRequest);
  const c=$("#cancelReq");if(c)c.addEventListener("click",()=>{clearTimeout(S.reqTimer);S.myReq=null;renderTrade();});
  view.querySelectorAll("[data-offer]").forEach(b=>b.addEventListener("click",()=>offerToSalon(+b.dataset.offer)));
  $("#conn").addEventListener("click",()=>{
    const v=$("#codeIn").value.trim();
    if(v.length<4)return toast("Tipeá los 4 números");
    codeSwap();
  });
}

/* pedir una figu (Se busca) */
function pickRequest(){
  const ms=missing();
  if(!ms.length)return;
  showSheet(`
    <div class="mcard">
      <div class="kicker center">¿Cuál te falta?</div>
      <div class="opts mt8">${ms.map(f=>`<div class="opt" data-id="${f.id}"><span class="k">${f.g}</span>${f.nm}
        <span style="margin-left:auto;font-size:10px;color:var(--muted-2);font-weight:800;text-transform:uppercase">${f.fm}</span></div>`).join("")}</div>
      <button class="btn ghost mt12" id="cl">Cerrar</button>
    </div>`);
  $("#cl").addEventListener("click",hideSheet);
  sheet.querySelectorAll(".opt").forEach(el=>el.addEventListener("click",()=>{
    S.myReq=+el.dataset.id;hideSheet();renderTrade();
    feedPush(`<b>Vos</b> publicaste: busco <span class="g">${fig(S.myReq).nm} ${fig(S.myReq).g}</span>`,"🙋",true);
    toast("Tu pedido salió a la pantalla 🙋");
    scheduleReqOffer(6200);
  }));
}
function scheduleReqOffer(ms){
  clearTimeout(S.reqTimer);
  S.reqTimer=setTimeout(()=>{if(S.myReq&&!S.done)incomingOffer();},ms);
}
function incomingOffer(){
  const want=fig(S.myReq),who=rnd(GUESTS);
  const give=dupes()[0]||null;
  showSheet(`
    <div class="mcard">
      <div class="kicker center">¡Te respondieron!</div>
      <h2 class="center" style="font-family:'Cormorant Garamond';font-weight:700;font-size:30px;color:#fff;margin:6px 0 0">${who}</h2>
      <p class="hint center">tiene tu <b style="color:var(--gold-1)">${want.nm}</b> ${give?"y te propone:":"y te la regala 🤍"}</p>
      ${give?`<div class="swap">
        <div class="mini"><div class="g">${give.g}</div><div class="nm">${give.nm}</div><div class="who">vos das</div></div>
        <div class="ar">⇄</div>
        <div class="mini"><div class="g">${want.g}</div><div class="nm">${want.nm}</div><div class="who">${who} da</div></div>
      </div>`:`<div class="swap"><div class="mini" style="max-width:140px;margin:0 auto">
        <div class="g">${want.g}</div><div class="nm">${want.nm}</div><div class="who">para vos</div></div></div>`}
      <button class="btn rose" id="ok">Aceptar</button>
      <button class="btn ghost mt8" id="no">Ahora no</button>
    </div>`);
  $("#no").addEventListener("click",()=>{hideSheet();scheduleReqOffer(9000);});
  $("#ok").addEventListener("click",()=>{
    if(give){if(S.counts[give.id]>1)S.counts[give.id]--; }
    S.counts[want.id]=(S.counts[want.id]||0)+1;
    feedPush(`<b>Vos</b> y <b>${who}</b> cambiaron — conseguiste <span class="g">${want.nm} ${want.g}</span>`,"🔄",true);
    S.myReq=null;clearTimeout(S.reqTimer);
    hideSheet();render();
    if(uniques()===15&&!S.done)setTimeout(completion,420);
    else toast(`¡${want.nm} es tuya! Te faltan ${missing().length}`);
  });
}

/* ofrecer a un pedido del salón */
function offerToSalon(i){
  const r=S.salon[i],theirs=fig(r.figId);
  const back=rnd(missing());
  showSheet(`
    <div class="mcard">
      <div class="kicker center">Cambio con ${r.who}</div>
      <div class="swap mt12">
        <div class="mini"><div class="g">${theirs.g}</div><div class="nm">${theirs.nm}</div><div class="who">vos das</div></div>
        <div class="ar">⇄</div>
        <div class="mini"><div class="g">${back.g}</div><div class="nm">${back.nm}</div><div class="who">${r.who} da</div></div>
      </div>
      <button class="btn rose" id="ok">Cerrar el cambio</button>
      <button class="btn ghost mt8" id="no">Mejor no</button>
    </div>`);
  $("#no").addEventListener("click",hideSheet);
  $("#ok").addEventListener("click",()=>{
    if(S.counts[theirs.id]>1)S.counts[theirs.id]--;
    S.counts[back.id]=(S.counts[back.id]||0)+1;
    feedPush(`<b>Vos</b> le pasaste <span class="g">${theirs.nm}</span> a <b>${r.who}</b> y te llevaste <span class="g">${back.nm} ${back.g}</span>`,"🤝",true);
    S.salon[i]=newSalonReq();
    hideSheet();render();
    if(uniques()===15&&!S.done)setTimeout(completion,420);
    else toast(`¡${back.nm} es tuya! 🤝`);
  });
}

/* canje por código */
function codeSwap(){
  const who=rnd(GUESTS);
  const ms=missing();
  if(!ms.length)return toast("No te falta ninguna 👑");
  const want=rnd(ms),give=dupes()[0]||null;
  showSheet(`
    <div class="mcard">
      <div class="kicker center">Conectaste con</div>
      <h2 class="center" style="font-family:'Cormorant Garamond';font-weight:700;font-size:30px;color:#fff;margin:6px 0 0">${who}</h2>
      <p class="hint center">te propone:</p>
      <div class="swap">
        ${give?`<div class="mini"><div class="g">${give.g}</div><div class="nm">${give.nm}</div><div class="who">vos das</div></div>
        <div class="ar">⇄</div>`:""}
        <div class="mini"><div class="g">${want.g}</div><div class="nm">${want.nm}</div><div class="who">${who} da</div></div>
      </div>
      <button class="btn rose" id="ok">Aceptar cambio</button>
      <button class="btn ghost mt8" id="no">Cancelar</button>
    </div>`);
  $("#no").addEventListener("click",hideSheet);
  $("#ok").addEventListener("click",()=>{
    if(give&&S.counts[give.id]>1)S.counts[give.id]--;
    S.counts[want.id]=(S.counts[want.id]||0)+1;
    feedPush(`<b>Vos</b> y <b>${who}</b> cambiaron — conseguiste <span class="g">${want.nm} ${want.g}</span>`,"🔄",true);
    hideSheet();render();
    if(uniques()===15&&!S.done)setTimeout(completion,420);
    else toast(`¡${want.nm} es tuya!`);
  });
}

/* ================= EL REINO (feed) ================= */
function renderFeed(){
  view.innerHTML=`
    <div class="sh" style="margin-top:4px"><span>Pasó en el Reino</span><div class="ln"></div></div>
    <div class="feed">${S.feed.map(e=>`
      <div class="ev ${e.mine?"mine":""}"><span class="ic">${e.ic}</span>

function completion(){
  S.done=true;
  feedPush(`<span class="r">¡COMPLETASTE EL REINO!</span> Las 15 figus de Marti son tuyas 👑`,"🎆",true);
  showSheet(`
    <div class="rays"></div>
    <div style="position:relative;z-index:2" class="center">
      <div class="kicker">¡Completaste el Reino!</div>
      <div class="ticket mt16" style="margin-left:auto;margin-right:auto">
        <div class="crown">👑</div>
        <div class="nm">${S.name}</div>
        <div class="sub">Carta dorada de Marti</div>
        <div style="font-size:28px;margin-top:10px">🤍</div>
        <div class="ser">N.º 001 · PRIMERA EN COMPLETAR</div>
      </div>
      <div class="pill mt16" style="font-size:13px;padding:10px 18px">📷 ¡Ganás la cámara de fotos!</div>
      <p class="lead mt12" style="max-width:280px;margin-left:auto;margin-right:auto">Pasá por el
        <b style="color:var(--gold-1)">Mercadito del Reino</b>: Marti te entrega la carta en mano.</p>
      <button class="btn mt16" id="stay" style="max-width:230px">Seguir mirando el Reino</button>
      <button class="btn ghost mt8" id="rst" style="max-width:230px">Reiniciar demo</button>
    </div>`);
  confettiBurst();
  $("#stay").addEventListener("click",()=>{hideSheet();S.tab="feed";S.unread=0;render();});
  $("#rst").addEventListener("click",()=>{clearTimeout(S.reqTimer);S=freshState();hideSheet();view.className="pad intro";render();});
}

/* confetti */
function confettiBurst(){
  const cv=$("#confetti"),ctx=cv.getContext("2d");
  cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;
  const cols=["#f6dd99","#f1a8c6","#e3b85f","#ffffff","#d76a98"];
  const P=[];for(let i=0;i<110;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,
    vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.2,s:4+Math.random()*5,c:rnd(cols),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.2});
  const t0=performance.now();
  (function loop(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});
    if(t-t0<3400)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

/* ================= INIT ================= */
view.className="pad intro";
render();
</script>
