<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b1340">
<title>Figus del Reino · Los XV de Marti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@400;500;600;700;800;900&family=Chewy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="preload" as="image" href="assets/logo.png">
<link rel="preload" as="image" href="assets/logo-m.png">
<link rel="preload" as="image" href="assets/frames/comun.jpg">
<link rel="preload" as="image" href="assets/frames/especial.jpg">
<link rel="preload" as="image" href="assets/frames/legendaria.jpg">
<link rel="preload" as="image" href="assets/frames/oro.jpg">
</head>
<body>
<div id="device">
  <div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="stars" id="stars"></div>
  <div class="castle">
    <svg viewBox="0 0 430 200" preserveAspectRatio="xMidYMax meet">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a2a66"/><stop offset="1" stop-color="#150d31"/></linearGradient></defs>
      <g fill="url(#cg)">
        <rect x="36" y="128" width="58" height="72"/><polygon points="36,128 65,92 94,128"/>
        <rect x="336" y="128" width="58" height="72"/><polygon points="336,128 365,92 394,128"/>
        <rect x="148" y="104" width="134" height="96"/>
        <rect x="176" y="58" width="32" height="142"/><polygon points="176,58 192,24 208,58"/>
        <rect x="222" y="58" width="32" height="142"/><polygon points="222,58 238,24 254,58"/>
        <rect x="120" y="150" width="190" height="50"/>
      </g>
      <g fill="#f6dd99" opacity=".85">
        <rect x="187" y="78" width="8" height="13" rx="3"/><rect x="233" y="78" width="8" height="13" rx="3"/>
        <rect x="58" y="146" width="9" height="15" rx="3"/><rect x="362" y="146" width="9" height="15" rx="3"/>
        <rect x="204" y="132" width="20" height="32" rx="9"/>
      </g>
    </svg>
  </div>

  <header id="hdr"></header>
  <main><div id="view" class="pad"></div></main>
  <div class="giftbar" id="giftbar" style="display:none"></div>
  <nav id="nav">
    <button data-tab="album"><span class="ic">📔</span>Álbum</button>
    <button data-tab="trade"><span class="ic">🔄</span>Cambiar</button>
    <button data-tab="prizes" class="goldtab"><span class="ic">🏆</span>Premios</button>
    <button data-tab="feed"><span class="ic">🏰</span>Reino<span class="dot" id="feedDot" style="display:none">0</span></button>
    <button data-tab="account"><span class="ic">👤</span>Cuenta</button>
  </nav>

  <div class="sheet" id="sheet"></div>
  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
