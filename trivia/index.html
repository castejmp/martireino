<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trivia del Reino · Martina XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800;900&family=Chewy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ===== START ===== -->
  <section id="start" class="screen show">
    <img class="logo" src="../assets/logo.png" alt="Martina Fifteen">
    <h1 class="title">Trivia del Reino</h1>
    <p class="subtitle">5 preguntas al azar · cada respuesta correcta vale una figu</p>
    <label class="field">
      <span>Nombre del participante</span>
      <input id="nombre" type="text" placeholder="Ej: Adriana Mignola" autocomplete="off">
    </label>
    <button id="empezar" class="btn primary big">Empezar trivia</button>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz" class="screen">
    <header class="qhead">
      <div class="who"><span id="qNombre"></span></div>
      <div class="prog"><span id="qNum">1</span>/5</div>
    </header>
    <div class="dots" id="dots"></div>
    <div class="peli" id="qPeli"></div>
    <div class="pregunta" id="qTexto"></div>
    <div class="opciones" id="qOpciones"></div>
    <button id="siguiente" class="btn primary big" disabled>Siguiente</button>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" class="screen">
    <div class="rcheer" id="rEmoji">🎉</div>
    <div class="rscore"><span id="rNum">0</span><small>de 5</small></div>
    <div class="rgive">Entregale <b id="rFigus">0</b> figus a<br><span id="rNombre"></span></div>
    <div class="rlist" id="rList"></div>
    <button id="otro" class="btn primary big">Nuevo participante</button>
  </section>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
